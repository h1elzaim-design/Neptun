[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The brand/repo is "Neptun"; the import package stays `quantrace` so existing
# code and docs keep working. See README and the project's open-source boundary.
name = "quantrace"
version = "0.1.0"
description = "Neptun: an open-source framework for quant trading research — OpenBB data, vectorbt backtests, a six-dimensional evaluation score, and walk-forward validation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Neptun contributors" }]
keywords = ["trading", "quant", "backtesting", "openbb", "vectorbt", "research"]

dependencies = [
    "vectorbt>=0.26.0",
    "pandas>=2.0",
    "numpy>=1.24,<2.0",
    "pyarrow>=15.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
data = ["openbb>=4.3.0"]  # live data fetching via OpenBB; not needed for tests or CI
ibkr = ["ib_insync>=0.9.86"]
# The MCP surface: `python -m quantrace.mcp_server` makes the engine steerable
# by any agent that speaks MCP. An extra, not a base dependency — the library
# is useful without a server, and nothing else imports the SDK.
mcp = ["mcp>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/<you>/Neptun"
Source = "https://github.com/<you>/Neptun"

[project.scripts]
quantrace = "quantrace.cli:app"

[tool.setuptools.packages.find]
# Public surface only: the engine and the strategy templates. No private agents.
include = ["quantrace*", "strategies*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses callables in argument defaults by design (Option, Argument).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on broad exceptions and import lazily after setup.
"tests/**" = ["B017", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires network/OpenBB providers",
    "slow: long-running",
]
