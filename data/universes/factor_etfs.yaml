# Faktor-/Smart-Beta-Universum: investierbare Faktor-Prämien als ETFs.
# Gedacht für Faktor-Rotation, Cross-Sectional-Momentum und Regime-Studien
# (welcher Faktor führt in welchem Regime?).
name: factor_etfs
description: "Investierbare Faktor-ETFs (Momentum, Value, Quality, Size, Low-Vol, …)."
timeframe: 1d
provider: eodhd
# Handelskalender (#184): bestimmt die Annualisierung. us_equity = 252
# Handelstage. Ein Universum, ein Kalender — Mischen wäre stiller Betrug
# an jedem Sharpe, der daraus entsteht.
calendar: us_equity
# Anlageklasse — ausdrücklich, nicht aus dem Namen geraten. `sector_spdrs`
# und `global_macro` sind ETF-Körbe, ohne dass "etf" im Namen steht; eine
# Heuristik hätte sie unter "other" einsortiert und damit im Dropdown eine
# plausible Falschangabe erzeugt. etf | equity | crypto | other
asset_class: etf
delisted_included: true
point_in_time: false
last_audit_date: 2026-06-05
source_notes: |
  iShares/Invesco Faktor-ETFs auf den US-Large-Cap-Markt. Alle seit ≥2013
  gelistet und liquide. MTUM/QUAL/VLUE/SIZE/USMV teilen denselben MSCI-USA-
  Basisindex, was sie zu einem sauberen Faktor-Vergleich macht.
# Gemessen am 2026-08-09 gegen Tiingos `supported_tickers`, nicht geschätzt.
# Ein Universum kann erst beginnen, wenn ALLE Symbole Daten haben — begrenzend
# ist deshalb immer das zuletzt aufgelegte. `scripts/universe_window_audit.py
# --check` hält Zusage und Realität zusammen und läuft in CI.
usable_window:
  start: 2013-07-18          # begrenzt durch QUAL (Auflage 2013-07-18)
  end: null               # offen — die Reihen laufen weiter
symbols:
  - MTUM  # Momentum (iShares MSCI USA Momentum)
  - QUAL  # Quality (iShares MSCI USA Quality)
  - VLUE  # Value (iShares MSCI USA Value)
  - SIZE  # Size (iShares MSCI USA Size)
  - USMV  # Min Volatility (iShares MSCI USA Min Vol)
  - SPLV  # Low Volatility (Invesco S&P 500 Low Vol)
  - SPHB  # High Beta (Invesco S&P 500 High Beta)
  - VTV   # Large Value (Vanguard)
  - VUG   # Large Growth (Vanguard)
  - QQQ   # Growth/Tech-Proxy (Nasdaq 100) als Benchmark-Anker
