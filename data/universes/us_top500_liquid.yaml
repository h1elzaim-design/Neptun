# Konstruiert aus dem US-Bulk-Querschnitt (2026-09-01).
# Erzeugt von api/services/universe_export.py — die Regel unten ist die Quelle,
# die Symbolliste ihr Ergebnis über alle Stichtage (die Vereinigung).
# Wer die Regel ändert, legt ein neues Universum an, statt diese Datei
# zu editieren.
name: us_top500_liquid
description: "Die 500 liquidesten US-Papiere, halbjährlich neu ausgewählt. Rang nach Median-Dollarvolumen über 60 Handelstage — NICHT nach Marktkapitalisierung: der Lake fuehrt keine Stueckzahlen, und ein erfundenes Groessenmass waere schlimmer als das ehrliche Liquiditaetsmass. Fuer einen Backtest ist es ohnehin das passendere: es waehlt, was damals handelbar war."
timeframe: 1d
provider: eodhd
calendar: us_equity
asset_class: equity
# Kostenklasse für alle Mitglieder — die Liquiditätsregel hat sie bestimmt.
# Maßstab ist der GEMESSENE Boden der Auswahl (14.5 Mio $
# Median-Tagesvolumen), also der schwächste Titel im Korb. Das überschätzt die
# Kosten der großen Namen, und zwar in die richtige Richtung: ein Backtest, der
# zu teuer rechnet, verwirft eine gute Strategie — einer, der zu billig rechnet,
# gibt eine schlechte frei.
cost_class: us_equity_liquid
# Die Regel und ihr Ergebnis.
# REKONSTITUIERT: die Regel lief an jedem Stichtag neu, `membership:` unten
# führt die Mitgliedschaft über die Zeit. `symbols:` ist die VEREINIGUNG über
# alle Perioden — die Ladeliste, nicht der Korb eines Tages. Wer sie ohne
# `membership:` liest, handelt Papiere, bevor die Regel sie gewählt hat.
construction:
  method: liquidity_screen
  rebalance: "6M"
  rule:
    as_of: "2000-01-03"
    lookback_days: 60
    min_dollar_volume: 5000000.0
    min_price: 5.0
    min_coverage: 0.8
    top_n: 500
    exchanges: []
  measured:
    n_candidates: 14294
    n_selected: 1934
    liquidity_floor: 14522140
    window_start: 1999-07-08
    window_end: 2000-01-03
    delisted_after_as_of: 855
    n_periods: 42
    first_as_of: 2000-01-03
    last_as_of: 2020-07-03
    median_turnover: 0.1360
    max_turnover: 0.2880
    drift: 0.7460
# Umschlag GEMESSEN: Median 13.6% je Rekonstitution.
# `drift` 74.6%: so viel des ersten Korbs wählt die Regel am letzten
# Stichtag nicht mehr — so falsch wäre ein Schnappschuss geworden, ohne dass
# die Kurve es verraten hätte.
