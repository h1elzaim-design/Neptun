# Erstes Nicht-Aktien-Universum (#184). Liquide USD-Paare über Tiingo-Crypto.
name: crypto_majors
description: "Liquide Crypto-USD-Paare — erstes Universum mit 24/7-Kalender."
timeframe: 1d
provider: tiingo
# Handelskalender (#184): 365 statt 252. Der Unterschied ist nicht kosmetisch —
# derselbe Return-Pfad mit 252 gerechnet ergibt einen um √(365/252) ≈ 1.20 zu
# hohen Sharpe, und DSR, PBO und der Governance-Score verarbeiten diesen Wert
# präzise weiter. Ein Kandidat könnte allein durch die falsche Annualisierung
# über die 0.70-Schwelle rutschen.
calendar: crypto_24_7
# Handverlesen und zum Auditdatum handelbar. Für Crypto ist Survivorship-Bias
# **größer** als bei Aktien, nicht kleiner: der Friedhof aus 2018 und 2022
# (LUNA, FTT und mehrere hundert kleinere) fehlt hier per Konstruktion, und
# genau das waren die Coins, die eine Momentum-Strategie gekauft hätte.
delisted_included: false
point_in_time: false
last_audit_date: 2026-08-04
source_notes: |
  ⚠️ EMPFOHLENES STARTDATUM: 2022-01-01. Davor hat die Quelle Löcher (unten).
  Ab 2022 sind alle neun Paare lückenlos — 1096 Tage am Stück.

  Kein Index, keine rekonstruierte Mitgliedschaft — eine Liste von neun Paaren,
  die am 2026-08-03 liquide waren. Wer daraus ein Cross-Sectional-Momentum
  baut, misst zu einem erheblichen Teil, dass die Überlebenden überlebt haben.
  Der Survivorship-Audit stuft dieses Universum deshalb als erhöhtes Risiko
  ein; das ist die richtige Antwort, kein Mangel der Datei.

  Bewusst nicht drin: MATICUSD. Polygon hat 2024 auf POL migriert — die
  Ticker-Historie ist über den Wechsel hinweg nicht durchgängig, und ein
  stillschweigend zusammengeklebter Kurspfad wäre schlimmer als eine Lücke.
  Die Kostenklasse für MATICUSD steht trotzdem in config/costs.yaml, damit ein
  gezielter Einzelabruf nicht auf default_class fällt.

  DATENLAGE, gemessen am 2026-08-04 über 2021-01-01..2024-12-31:

    AVAXUSD    beginnt erst 2021-05-12 (131 Tage Randabschnitt)
               8 fehlende Tage, alle 2021 — zusammenhängend 2021-11-23..30
    SOLUSD     39 fehlende Tage, alle 2021
    übrige 7   lückenlos über den ganzen Zeitraum

  Gegen die API gegengeprüft: Tiingo liefert diese Tage auch bei gezielter
  Einzelabfrage nicht. Löcher der Quelle, kein Fetch-Fehler.

  Warum das zählt: in einem 24/7-Markt verschwindet ein fehlender Tag nicht,
  er wird zur stillen Umdeutung. Fehlen bei SOL der 25.–28. Februar, geht die
  Bewegung vom 24.02. auf den 01.03. als EIN-Tages-Rendite in die Statistik.
  Das bläht die gemessene Volatilität dieses Bars auf und verzerrt jede
  Pro-Perioden-Kennzahl darüber — dieselbe Fehlerklasse wie eine falsche
  Annualisierung, nur eine Ebene tiefer.

  AVAX ist zusätzlich heikel: der 8-Tage-Block liegt im November 2021, direkt
  am Allzeithoch und zu Beginn des Abverkaufs. Eine Momentum-Strategie hätte
  die Position genau dann gehalten.

  Deshalb 2022-01-01. Das kostet ein Jahr Historie und ist der billigste
  ehrliche Ausweg — für Crypto verkraftbar, weil 2022–2024 Bärenmarkt UND
  Erholung enthält. Wer früher startet, bekommt vom Data-Quality-Gate
  Warnungen für AVAXUSD und SOLUSD; die sind dann korrekt und gehören in die
  Bewertung, nicht weggeklickt.

  Die eigentliche Abhilfe wäre eine zweite Crypto-Quelle — zwei Anbieter haben
  kaum an denselben Tagen Löcher. Das ist Datenbreite (Engpass Nr. 1), kein
  Problem dieser Datei.
